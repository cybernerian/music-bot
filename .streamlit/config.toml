[server]
enableStaticServing = true

[[theme.fontFaces]]
family="arnold-bocklin"
url="app/static/arnold-bocklin.ttf"
style="normal"
weight=400

[[theme.fontFaces]]
family="vipnagorgialla-rg"
url="app/static/vipnagorgialla-rg.otf"
style="normal"
weight=400

[theme]
base="dark"
primaryColor="#53af4a"
backgroundColor="#17191c"
secondaryBackgroundColor="#111111"
textColor="#FFFFFF"

# - - - - - - - -
# Darker Green
orangeColor="#53af4a"
orangeBackgroundColor="#2A1405"
orangeTextColor="#6fb541"

# Iris Purple
violetColor="#5D3FD3"
violetBackgroundColor="#1E183D"
violetTextColor="#5D3FD3"

# Chartreuse
greenColor="#9ff058"
greenBackgroundColor="#1E183D"
greenTextColor="#9ff058"

# Orangered
redColor="ff4500"
redBackgroundColor="ff4500"
redTextColor="ff4500"
# - - - - - - - -

# - - - - - - - -
# Vipnagorgialla for body text (st.write)
font="vipnagorgialla-rg"

# Arnold Bocklin for headings (st.title, st.header)
headingFont="arnold-bocklin"
# - - - - - - - -